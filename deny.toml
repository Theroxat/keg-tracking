# Audit des dépendances. Une faille connue ou une licence incompatible
# arrête la chaîne d'intégration.

[advisories]
yanked = "deny"
ignore = [
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
  "OpenSSL", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Les crates du dépôt ne sont pas publiées (`publish = false`) : pas de licence.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Les dépendances internes par chemin (`workspace = true`) n'ont pas de version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
