name: Pages

# Publie la page de présentation et la démonstration statique (docs/demo).
# Les guides Markdown de docs/ ne sont pas publiés.
on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/demo/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site
        run: |
          mkdir _site
          cp docs/index.html _site/
          cp -r docs/demo docs/images _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
