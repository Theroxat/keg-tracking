name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include screenshots or error messages if relevant.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: User role
      options:
        - Lecture (read)
        - Production
        - Administrateur (administrator)
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Mobile
        - Desktop
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit hash.
      placeholder: "1.0.0"
    validations:
      required: true
