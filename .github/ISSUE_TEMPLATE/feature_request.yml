name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which workflow is slowed down or impossible today?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: How should it work once implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: role
    attributes:
      label: User role
      options:
        - Lecture (read)
        - Production
        - Administrateur (administrator)
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Mobile
        - Desktop
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit hash.
      placeholder: "1.0.0"
    validations:
      required: true
