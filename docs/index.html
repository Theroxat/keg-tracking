<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Keg Tracking</title>
<meta name="description" content="QR-code traceability for returnable beer kegs. Static demo with sample data.">
<style>
  :root { --fond:#f7f6f3; --encre:#14171a; --encre-2:#3d4650; --accent:#0b6e6e; --bordure:#e6e4de; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#0f1214; --encre:#eef1f2; --encre-2:#b9c2c7; --accent:#4cc3c0; --bordure:#262c30; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
  h1 { margin: 0 0 8px; font-size: 34px; }
  p { color: var(--encre-2); }
  .liens { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 32px; }
  .liens a { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent);
             color: var(--accent); text-decoration: none; font-weight: 600; }
  .liens a:first-child { background: var(--accent); color: var(--fond); }
  img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--bordure); }
</style>
</head>
<body>
<main>
  <h1>Keg Tracking</h1>
  <p>QR-code traceability for returnable beer kegs, offered as SaaS to breweries. Every keg carries a QR label and every field operation is a scan.</p>
  <div class="liens">
    <a href="demo/">Static demo</a>
    <a href="https://github.com/Theroxat/WebQr_brasserie">GitHub repository</a>
  </div>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="images/hero-dark.png">
    <img src="images/hero-light.png" alt="The keg fleet on desktop, with the scan screen on a phone">
  </picture>
</main>
</body>
</html>
